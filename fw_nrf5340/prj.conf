# Logs: printk to RTT (same channel as fw/'s NRF_LOG RTT backend), no UART console.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_GPIO=y
CONFIG_I2C=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# BLE peripheral "mustard": same service, characteristics and packet format as fw/
# (host/protocol.py). The controller runs on the network core (sysbuild/ipc_radio).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="mustard"
CONFIG_BT_MAX_CONN=1
# ATT MTU 247 and data length 251, like NRF_SDH_BLE_GATT_MAX_MTU_SIZE / _GAP_DATA_LENGTH.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# fw/'s nrf_ble_gatt starts the data length update (251) after connecting.
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
# fw/ only answers PHY update requests (BLE_GAP_PHY_AUTO), it does not start one.
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_USER_PHY_UPDATE=y
# Preferred connection parameters 7.5-15 ms, latency 0, timeout 4 s (fw/main.h), requested
# 5 s after connecting like FIRST_CONN_PARAMS_UPDATE_DELAY.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000
CONFIG_REBOOT=y
