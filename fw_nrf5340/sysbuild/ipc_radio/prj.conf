# Network core: Nordic ipc_radio image as the BLE controller (HCI over IPC).
# Based on nrf/samples/bluetooth/throughput/sysbuild/ipc_radio/prj.conf.
CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y

# Same link setup as fw/'s S140 configuration: data length 251, connection events as long
# as the interval allows (NRF_SDH_BLE_GAP_EVENT_LENGTH 400 = 500 ms).
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=4000000
CONFIG_BT_MAX_CONN=1

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Time sync (src/timesync.c, as nrf/samples/bluetooth/conn_time_sync): anchor point reports, and
# IPC channel 4 when the controller RTC starts, which clears the application core's RTC0.
CONFIG_BT_CTLR_SDC_CONN_ANCHOR_POINT_REPORT=y
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START=y
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START_CHANNEL=4
