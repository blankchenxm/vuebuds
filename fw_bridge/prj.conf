# Logs: printk to RTT, like fw_nrf5340 (the J-Link VCOM UART stays free).
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Data to the PC: USB CDC ACM on the "nRF USB" connector (full speed, 12 Mbit/s).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="VueBuds bridge"
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_MAIN_STACK_SIZE=4096

# BLE central for the two camera boards (src/central.c).
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="vuebuds-bridge"
# ATT MTU 498, data length 251, 2M PHY (as the camera boards).
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
# Receive side: enough controller and host buffers that a full connection event of
# notifications is acknowledged, not NACKed for lack of a buffer.
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=20
CONFIG_BT_BUF_EVT_RX_COUNT=16
# Extend connection events into the free part of the interval (the default); the
# initial reservation per event stays at the default 7.5 ms.
CONFIG_BT_CTLR_SDC_CONN_EVENT_EXTEND_DEFAULT=y
# Link setup (PHY, data length, MTU, discovery) runs on the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Time sync (src/central.c): connection anchor point reports (HCI VS event).
CONFIG_BT_CTLR_SDC_CONN_ANCHOR_POINT_REPORT=y
CONFIG_BT_HCI_VS_EVT_USER=y
